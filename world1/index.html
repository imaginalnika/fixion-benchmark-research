<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Fixion world1 — portal explorer (temp)</title>
<style>
:root{--bg:#0f1115;--panel:#1a1d24;--ink:#e8e6e3;--mut:#9aa3b2;--acc:#6ea8fe;--door:#e6b35a;--edge:#7db7ff;--down:#c792ea;--up:#7dcea0}
*{box-sizing:border-box}body{margin:0;font-family:ui-sans-serif,system-ui,sans-serif;background:var(--bg);color:var(--ink)}
header{display:flex;gap:12px;flex-wrap:wrap;align-items:center;padding:10px 14px;background:#14161c;border-bottom:1px solid #2a2f3a;position:sticky;top:0;z-index:5}
header b{font-size:15px}header select,header button{background:#222733;color:var(--ink);border:1px solid #3a4150;border-radius:8px;padding:6px 10px}
main{display:grid;grid-template-columns:1.2fr .8fr;gap:14px;padding:14px;max-width:1200px;margin:0 auto}
@media(max-width:900px){main{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid #2a2f3a;border-radius:12px;padding:12px}
img.map{width:100%;border-radius:8px;background:#000;min-height:200px;object-fit:contain}
.mut{color:var(--mut);font-size:13px}
h1{font-size:20px;margin:0 0 6px}h2{font-size:14px;margin:14px 0 8px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
pre{white-space:pre-wrap;font-family:ui-serif,Georgia,serif;font-size:14px;line-height:1.45;max-height:48vh;overflow:auto;margin:0}
.ports{display:flex;flex-direction:column;gap:8px}
.ports button{text-align:left;padding:10px 12px;border-radius:10px;border:1px solid #3a4150;background:#222733;color:var(--ink);cursor:pointer}
.ports button:hover{border-color:var(--acc)}
.tag{display:inline-block;font-size:11px;padding:2px 6px;border-radius:999px;margin-right:6px;background:#2a3140}
.tag.edge{background:#1e3a5f;color:var(--edge)}.tag.door{background:#4a3a1a;color:var(--door)}
.tag.descent{background:#3a1f4a;color:var(--down)}.tag.climb{background:#1f3a2a;color:var(--up)}.tag.return{background:#333}
.crumb{font-size:13px;color:var(--mut)}
.crumb a{color:var(--acc);cursor:pointer;text-decoration:none}
footer{padding:10px 14px;color:var(--mut);font-size:12px;border-top:1px solid #2a2f3a;margin-top:20px}
</style></head><body>
<header>
  <b>Fixion world1 explorer</b>
  <label class="mut">Start scene
    <select id="world"></select>
  </label>
  <span id="crumb" class="crumb"></span>
  <span class="mut" id="meta"></span>
</header>
<main>
  <section class="card">
    <h1 id="title">—</h1>
    <div class="mut" id="label"></div>
    <p class="mut" id="set"></p>
    <img class="map" id="img" alt="map render"/>
  </section>
  <section class="card">
    <h2>Portals</h2>
    <div class="ports" id="ports"></div>
    <h2>Opening</h2>
    <pre id="opening"></pre>
  </section>
</main>
<footer>Temporary research page — portal-connected maps grown from the four hand-authored Fixion scenes. Not shipped. Delete after review.</footer>
<script src="data.js"></script>
<script>
const W = WORLD1.worlds;
const sel = document.getElementById('world');
let worldId = Object.keys(W)[0];
let mapId = W[worldId].start;
for (const id of Object.keys(W)) {
  const o = document.createElement('option'); o.value = id; o.textContent = W[id].title; sel.appendChild(o);
}
sel.onchange = () => { worldId = sel.value; mapId = W[worldId].start; render(); };
function go(id){ mapId = id; render(); }
window.go = go;
function render(){
  const world = W[worldId]; let m = world.maps[mapId];
  if(!m){ mapId = world.start; m = world.maps[mapId]; }
  document.getElementById('title').textContent = m.title;
  document.getElementById('label').textContent = (m.look ? ('look: ' + m.look + ' · ') : '') + (m.label || '');
  document.getElementById('set').textContent = m.set_line || '';
  document.getElementById('img').src = m.image;
  document.getElementById('opening').textContent = m.opening || '(no opening text)';
  document.getElementById('meta').textContent = m.hand ? 'hand-authored start' : ('generated · parent ' + (m.parent || '?'));
  const crumb = document.getElementById('crumb');
  crumb.innerHTML = '';
  const a = document.createElement('a'); a.textContent = world.title; a.onclick = () => go(world.start); crumb.appendChild(a);
  if (mapId !== world.start) {
    crumb.appendChild(document.createTextNode(' / '));
    const b = document.createElement('b'); b.textContent = m.title; crumb.appendChild(b);
  }
  const ports = document.getElementById('ports'); ports.innerHTML = '';
  (m.portals || []).forEach(p => {
    const btn = document.createElement('button');
    const tag = document.createElement('span'); tag.className = 'tag ' + p.kind; tag.textContent = p.kind;
    btn.appendChild(tag); btn.appendChild(document.createTextNode(' ' + p.label));
    btn.onclick = () => go(p.to);
    ports.appendChild(btn);
  });
  if (!(m.portals || []).length) ports.innerHTML = '<div class="mut">No portals from here.</div>';
  history.replaceState(null, '', '#' + worldId + '/' + mapId);
}
const hash = location.hash.slice(1).split('/');
if (hash[0] && W[hash[0]]) { worldId = hash[0]; sel.value = worldId; if (hash[1] && W[worldId].maps[hash[1]]) mapId = hash[1]; }
render();
</script>

</body></html>
